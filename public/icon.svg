<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with safe zone padding for maskable icon -->
  <rect width="512" height="512" rx="112" fill="#020617" />
  <rect x="56" y="56" width="400" height="400" rx="90" fill="url(#bgGrad)" filter="url(#glow)" />
  <!-- YouTube play symbol with pulse waves -->
  <path d="M216 190 L340 256 L216 322 Z" fill="#ffffff" />
  <circle cx="370" cy="180" r="14" fill="#fbbf24" />
  <circle cx="395" cy="160" r="8" fill="#fbbf24" opacity="0.8" />
  <!-- Pulse waveform lines -->
  <path d="M140 370 Q 180 340, 220 370 T 300 370 T 380 370" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6" />
</svg>
